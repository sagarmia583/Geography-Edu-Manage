<script>
function componentMarksTableHtml(rows){
  rows = rows || [];
  const hasComponent = rows.some(m => m.testGrade || m.incourseGrade || m.attendanceGrade || m.componentGrade);
  if (hasComponent) {
    return '<table><thead><tr><th>Code</th><th>Subject</th><th>Total</th><th>Final Grade</th><th>Test Grade</th><th>Incourse Grade</th><th>Attendance Grade</th><th>Status</th></tr></thead><tbody>' +
      rows.map(m => `<tr><td>${esc(m.code)}</td><td>${esc(m.subject)}</td><td>${esc(m.mark)}</td><td>${esc(m.grade)} ${esc(m.gradePercent||'')}</td><td>${esc(m.testMark!==undefined?m.testMark:'')} ${esc(m.testGrade||m.componentGrade||'')} ${esc(m.testPercent||m.componentPercent||'')}</td><td>${esc(m.incourseAverage!==undefined?m.incourseAverage:'')} ${esc(m.incourseGrade||'')} ${esc(m.incoursePercent||'')}</td><td>${esc(m.attendanceMark!==undefined?m.attendanceMark:'')} ${esc(m.attendanceGrade||'')} ${esc(m.attendancePercent||'')}</td><td>${esc(m.status)}</td></tr>`).join('') +
      '</tbody></table>';
  }
  return '<table><thead><tr><th>Code</th><th>Subject</th><th>Marks</th><th>Grade</th><th>GP</th><th>Status</th></tr></thead><tbody>' +
    rows.map(m => `<tr><td>${esc(m.code)}</td><td>${esc(m.subject)}</td><td>${esc(m.mark)}</td><td>${esc(m.grade)} ${esc(m.gradePercent||'')}</td><td>${esc(m.gp)}</td><td>${esc(m.status)}</td></tr>`).join('') +
    '</tbody></table>';
}

</script>

const resultBox = document.getElementById('resultBox');
const marksheetView = document.getElementById('marksheetView');

function esc(v){return String(v ?? '').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function selectedExamNameForResult(){return examSelect && examSelect.options && examSelect.selectedIndex>=0 ? examSelect.options[examSelect.selectedIndex].text : '';}
function examTitle(e){return e.ExamName || e.DisplayName || [e.SessionYear,e.AcademicYear,e.ExamType].filter(Boolean).join(' - ');}
function gradePointText(gp){ return gp === undefined || gp === null || gp === '' ? '' : Number(gp).toFixed(2); }

async function loadSessions(){
  showStatus(statusEl,'info','Loading...');
  try{
    const res = await geoApiGet('getPublishedExamSessions', {_t:Date.now()});
    const sessions = res.sessions || [];
    fillSelect(sessionSelect, sessions, sessions.length ? 'Select session' : 'No published result');
    if(sessions.length){
      sessionSelect.value = sessions[0];
      await loadExams();
    }else{
      fillSelect(examSelect, [], 'No published exam');
      showStatus(statusEl,'err','এখনো কোনো result publish করা হয়নি।');
    }
  }catch(err){ showStatus(statusEl,'err',err.message); }
}

async function loadExams(){
  const sessionYear = sessionSelect.value;
  fillSelect(examSelect, [], 'Loading exams...');
  try{
    const res = await geoApiGet('getPublishedExamsForStudent', {sessionYear, _t:Date.now()});
    const exams = res.exams || [];
    fillSelect(examSelect, exams.map(e=>({value:e.ExamID,label:examTitle(e)})), exams.length ? 'Select exam' : 'No published exam');
    if(exams.length) examSelect.value = exams[0].ExamID;
  }catch(err){ showStatus(statusEl,'err',err.message); }
}



function formatDateDMY(d){
  const dt = d ? new Date(d) : new Date();
  if(Number.isNaN(dt.getTime())) return String(d||'');
  const dd = String(dt.getDate()).padStart(2,'0');
  const mm = String(dt.getMonth()+1).padStart(2,'0');
  const yy = dt.getFullYear();
  return `${dd}/${mm}/${yy}`;
}

function regDigitBoxesHtml(reg){ return `<span class="nu-reg-single">${esc(reg || '')}</span>`; }
function courseWiseGradeTableHtml(rows){
  rows = rows || [];
  return `<table class="nu-course-table">
    <thead><tr><th>Course Code</th><th>Title of Course</th><th>Credit</th><th>Letter Grade</th></tr></thead>
    <tbody>
      ${rows.length ? rows.map(m=>{
        const code = m.code || m.SubjectCode || '';
        const title = m.subject || m.SubjectName || '';
        const credit = m.credit || m.Credit || m.credits || m.Credits || '';
        const grade = m.grade || m.Grade || '';
        return `<tr><td class="nu-center">${esc(code)}</td><td>${esc(title)}</td><td class="nu-center">${esc(credit)}</td><td class="nu-center nu-grade">${esc(grade)}</td></tr>`;
      }).join('') : `<tr><td colspan="4" class="nu-center">No course data found</td></tr>`}
    </tbody>
  </table>`;
}

function oldTextMarksTableHtml(rows){
  rows = rows || [];
  return `<table class="nu-course-table old-text-marks-table">
    <thead>
      <tr><th>Code</th><th>Subject</th><th>Marks</th><th>Grade</th><th>GPA</th></tr>
    </thead>
    <tbody>
      ${rows.length ? rows.map(m=>{
        const code = m.code || m.SubjectCode || '';
        const subject = m.subject || m.SubjectName || '';
        const mark = m.mark ?? m.Marks ?? '';
        const grade = m.grade || m.Grade || '';
        const gp = m.gp ?? m.GP ?? '';
          return `<tr>
            <td class="nu-center">${esc(code)}</td>
            <td class="text-left printable-name-cell">${esc(subject)}</td>
            <td class="nu-center">${esc(mark)}</td>
            <td class="nu-center nu-grade">${esc(grade)}</td>
            <td class="nu-center">${esc(gradePointText(gp))}</td>
          </tr>`;
      }).join('') : `<tr><td colspan="5" class="nu-center">No marks data found</td></tr>`}
    </tbody>
  </table>`;
}

function renderMarksheet(res){
  const exam = res.exam || {};
  const marks = res.marks || [];
  const examName = exam.ExamName || exam.DisplayName || 'Exam Result';
  const resultStatus = res.cgpa === 'FAIL' ? 'FAILED' : 'PASS';
  marksheetView.innerHTML = `
    <div class="nu-result-sheet old-text-result-sheet">
      <div class="nu-main-title">Kumudini Govt. College, Tangail</div>
      <div class="nu-sub-title">Department of Geography and Environment</div>
      <div class="nu-online-title">Individual Result Marksheet</div>
      <div class="nu-blue-line"></div>

      <table class="nu-info-table">
        <tr><th>Exam Name</th><td colspan="3">${esc(examName)}</td></tr>
        <tr>
          <th>Name</th><td>${esc(res.name)}</td>
          <th>Roll</th><td>${esc(res.roll)}</td>
        </tr>
        <tr>
          <th>Registration</th><td>${regDigitBoxesHtml(res.reg)}</td>
          <th>Session</th><td>${esc(exam.SessionYear || '')}</td>
        </tr>
        <tr>
          <th>Academic Year</th><td>${esc(exam.AcademicYear || '')}</td>
          <th>Result</th><td class="${res.cgpa==='FAIL'?'nu-fail':'nu-pass'}">${esc(resultStatus)}</td>
        </tr>
        <tr>
          <th>Total Marks</th><td>${esc(res.total)}</td>
          <th>GPA</th><td class="${res.cgpa==='FAIL'?'nu-fail':'nu-pass'}">${esc(res.cgpa)}</td>
        </tr>
        <tr>
          <th>Rank</th><td>${esc(res.rank || '-')}</td>
          <th>Non Major Group</th><td>${esc(res.groupText || res.nonMajorGroup || '-')}</td>
        </tr>
      </table>

      <div class="nu-course-title">Subject-wise Marks Details</div>
      ${oldTextMarksTableHtml(marks)}

      <div class="nu-sign-area">
        <div class="nu-controller nu-left-sign"><b>Head of the Department</b></div>
        <div class="nu-controller nu-right-sign">
          <b>Course Teacher</b><br>
          <span>Generated by: Sagar Ahmed, Computer Operator, Geography</span><br>
          <span>Generated on: ${esc(formatDateDMY())}</span>
        </div>
      </div>
    </div>`;
}


function printStudentResult(){
  const content = marksheetView.innerHTML.trim();
  if(!content){alert('Result আগে search করুন।');return;}
  resultBox.classList.remove('hide');
  stableDirectPrint(resultBox,'Student Result Print',`
    @page{size:A4 portrait;margin:8mm}
    .stable-print-target .old-text-result-sheet{background:#fff!important;width:100%!important;max-width:100%!important}
  `);
}

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!sessionSelect.value || !examSelect.value || !searchInput.value.trim()){
    showStatus(statusEl,'err','Session, Exam এবং Roll/Registration দিন।');
    return;
  }
  showStatus(statusEl,'info','Result loading...');
  resultBox.classList.add('hide');
  try{
    const q = searchInput.value.trim();
    const res = await geoApiGet('getStudentResultFast', {
      sessionYear:sessionSelect.value,
      examId:examSelect.value,
      examName:selectedExamNameForResult(),
      search:q,
      roll:q,
      registrationNumber:q,
      _t:Date.now(),
      
    });
    if(!res || res.success === false || !res.found){
      showStatus(statusEl,'err',res.message || 'Result পাওয়া যায়নি / publish করা হয়নি।');
      return;
    }
    renderMarksheet(res);
    resultBox.classList.remove('hide');
    resultBox.scrollIntoView({behavior:'smooth',block:'start'});
    showStatus(statusEl,'ok','Result loaded. নিচে print page দেখা যাচ্ছে। Print Result দিয়ে print/save PDF করুন।');
  }catch(err){ showStatus(statusEl,'err',err.message); }
});

sessionSelect.addEventListener('change', loadExams);
loadSessions();
</script>
</body></html>
