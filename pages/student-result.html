<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Student Result Portal - Geography Department</title><link rel="stylesheet" href="../assets/site.css"></head><body><header class="topbar no-print"><div class="inner"><a class="brand" href="../student/index.html"><span class="brand-logo">🎓</span><span>Student Result</span></a><button class="mobile-menu" data-mobile-menu>Menu</button><nav class="navlinks"><a href="../student/index.html">Student Home</a><a href="student-registration.html">Registration</a><a href="student-result.html">Result</a><a href="library-card-generator.html">Library Card</a><a class="nav-cta" href="../admin/index.html">Admin Panel</a></nav></div></header><section class="page-hero"><div class="container"><h1>Result Search</h1></div></section><main class="page-pad"><div class="container thin"><div class="panel panel-lg result-card"><div class="panel-title"><div><h2>Find Result</h2></div><span class="pill green">Live Sheet</span></div><form id="resultForm" class="form-grid"><label class="field"><span class="label">Roll/ID Number</span><input class="input" name="rollId" placeholder="e.g. GEO-2024-001" required></label><div class="field" style="align-self:end"><button class="btn primary full" type="submit">Search Result</button></div></form><div id="resultStatus" class="status info hide"></div><div id="resultOutput" style="margin-top:24px"></div></div></div></main>
<script src="../assets/geography-api.js"></script><script>
const rf=document.getElementById('resultForm'), st=document.getElementById('resultStatus'), out=document.getElementById('resultOutput');
function renderResult(data){
 const s=data.student||{}, marks=data.marks||[], sum=data.summary||{};
 if(!marks.length){ out.innerHTML='<div class="empty">No result found for this Roll/ID.</div>'; return; }
 const rows=marks.map(m=>`<tr><td>${escapeHtml(m.courseId)}</td><td>${escapeHtml(m.courseTitle)}</td><td>${escapeHtml(m.semester)}</td><td><b>${escapeHtml(m.mark)}</b></td><td><span class="pill ${m.grade==='F'?'red':'green'}">${escapeHtml(m.grade)}</span></td></tr>`).join('');
 out.innerHTML=`<div class="result-banner"><div><h2>${escapeHtml(s.FullName||'Student Result')}</h2></div><div><span class="pill blue">${escapeHtml(sum.status||'Published')}</span></div></div><div class="marks-grid"><div class="panel"><div class="metric"><div class="big">${escapeHtml(sum.total||0)}</div></div></div><div class="panel"><div class="metric"><div class="big blue">${escapeHtml(sum.average||0)}</div></div></div><div class="panel"><div class="metric"><div class="big">${escapeHtml(sum.finalGrade||'')}</div></div></div></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>Course Code</th><th>Course Title</th><th>Semester</th><th>Mark</th><th>Grade</th></tr></thead><tbody>${rows}</tbody></table></div><div class="right-actions"><button class="btn secondary" onclick="window.print()">Print Result</button></div>`;
}
rf.addEventListener('submit',async(e)=>{e.preventDefault();const b=rf.querySelector('button');b.textContent='Searching...';b.disabled=true;out.innerHTML='<div class="panel text-center"><div class="loader"></div></div>';try{const data=await geoApiGet('getResult',{rollId:rf.rollId.value});showStatus(st,data.success?'ok':'err',data.message||'Result loaded');renderResult(data)}catch(err){showStatus(st,'err',err.message);out.innerHTML=''}finally{b.textContent='Search Result';b.disabled=false}});
</script>
<footer class="footer no-print"><div class="inner"><div><b>Geography &amp; Environment</b></div><div class="footer-links"><a href="../pages/student-registration.html">Registration</a><a href="../pages/student-result.html">Result</a><a href="../pages/seminar-library-admin.html">Seminar Library</a></div><div>© <span data-year></span> Department of Geography and Environment.<br>Kumudini Govt. College, Tangail.</div></div></footer>
<script src="../assets/site.js"></script>
</body></html>
