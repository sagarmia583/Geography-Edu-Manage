<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seminar Library Card Status</title><link rel="stylesheet" href="../assets/site.css?v=1789598642822">
 <style>body{background:#f7f5ef}.public-status-wrap{max-width:1100px;margin:0 auto;padding:18px}.status-hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow-soft);text-align:center}.status-hero h1{font-family:Georgia,"Times New Roman",serif;color:var(--primary);margin-bottom:8px}.status-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow-soft)}.status-profile{display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center}.status-avatar{width:86px;height:86px;border-radius:24px;background:var(--primary-soft);display:grid;place-items:center;font-size:2.4rem}.big-count{font-size:3rem;color:var(--primary);font-weight:900;line-height:1}@media(max-width:700px){.status-profile{grid-template-columns:1fr;text-align:center}.grid.two{grid-template-columns:1fr!important}}</style>
</head><body class="student-card-page"><header class="topbar student-topbar-full no-print student-card-topbar"><div class="inner"><a class="brand" href="../index.html"><span class="brand-logo">📚</span><span>Seminar Library Status</span></a><nav class="navlinks student-card-nav"><a href="../index.html">Home</a><a href="../student/index.html">Student Panel</a></nav></div></header><main class="public-status-wrap student-card-main"><section class="status-hero"><h1>Seminar Library Card Status</h1><div class="filter-row" style="grid-template-columns:1fr auto;max-width:640px;margin:16px auto 0"><input id="searchInput" class="input" placeholder="Roll or Registration Number"><button id="checkBtn" class="btn primary" type="button">Check Status</button></div><div id="statusBox" class="status info hide" style="margin-top:12px"></div></section><section id="resultArea" class="hide" style="margin-top:16px"><div class="grid two"><div class="status-card"><div class="status-profile"><div class="status-avatar">👤</div><div><h2 id="studentName" style="color:var(--primary);margin:0"></h2><p id="studentMeta" class="muted" style="margin:6px 0 0"></p></div></div></div><div class="status-card text-center"><div id="currentCount" class="big-count">0</div><p id="historyCount" class="muted" style="margin:8px 0 0"></p></div></div><div class="grid two" style="margin-top:16px"><div class="status-card"><h2 style="color:var(--primary)">Currently Issued Books</h2><div class="table-wrap"><table><thead><tr><th>SL</th><th>Book Code</th><th>Book Title</th><th>Issue Date</th><th>Due/Return Date</th></tr></thead><tbody id="currentTable"><tr><td colspan="5" class="empty">No current issue.</td></tr></tbody></table></div></div><div class="status-card"><h2 style="color:var(--primary)">Full Library History</h2><div class="table-wrap"><table><thead><tr><th>SL</th><th>Date</th><th>Action</th><th>Book Code</th><th>Book Title</th><th>Status</th></tr></thead><tbody id="historyTable"><tr><td colspan="6" class="empty">No history.</td></tr></tbody></table></div></div></div></section></main>
<script src="../assets/geography-api.js"></script>
<script src="../assets/site.js?v=1789598642822"></script>
<script>
const q = new URLSearchParams(location.search);
const preset = q.get('roll') || q.get('reg') || q.get('search') || '';
document.getElementById('searchInput').value = preset;

function esc(v){return String(v ?? '').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}

async function checkStatus(){
  const search = document.getElementById('searchInput').value.trim();
  if(!search){ showStatus(statusBox,'err','Roll or Registration Number required.'); return; }
  showStatus(statusBox,'info','Checking library status...');
  try{
    const res = await geoApiGet('getLibraryPublicStatus', { search });
    if(!res.found){
      document.getElementById('resultArea').classList.add('hide');
      showStatus(statusBox,'err',res.message || 'Student not found.');
      return;
    }

    const s = res.student || {};
    document.getElementById('studentName').textContent = s.Name || '';
    document.getElementById('studentMeta').innerHTML = `Roll: <b>${esc(s.Roll)}</b> | Regi: <b>${esc(s.RegistrationNumber)}</b><br>Session: <b>${esc(s.SessionYear)}</b> | Year: <b>${esc(s.CurrentYear)}</b>`;
    document.getElementById('currentCount').textContent = res.currentIssueCount || 0;
    document.getElementById('historyCount').textContent = `Total history entries: ${res.historyCount || 0}`;

    const current = res.currentIssued || [];
    document.getElementById('currentTable').innerHTML = current.length ? current.map((b,i)=>`<tr>
      <td>${i+1}</td><td>${esc(b.ISBN)}</td><td>${esc(b.BookTitle)}</td><td>${esc(b.IssueDate)}</td><td>${esc(b.ReturnDate)}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty">No currently issued book.</td></tr>';

    const history = res.history || [];
    document.getElementById('historyTable').innerHTML = history.length ? history.map((h,i)=>`<tr>
      <td>${i+1}</td><td>${esc(h.Timestamp)}</td><td>${esc(h.Action)}</td><td>${esc(h.ISBN)}</td><td>${esc(h.BookTitle)}</td><td>${esc(h.Status)}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="empty">No library history.</td></tr>';

    document.getElementById('resultArea').classList.remove('hide');
    showStatus(statusBox,'ok','Library status loaded.');
  }catch(err){
    showStatus(statusBox,'err',err.message);
  }
}

document.getElementById('checkBtn').addEventListener('click', checkStatus);
document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key === 'Enter') checkStatus(); });
if(preset) checkStatus();
</script>
</body></html>
