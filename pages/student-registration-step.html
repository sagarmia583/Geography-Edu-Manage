<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registration Details - Geography Department</title><link rel="stylesheet" href="../assets/site.css?v=1789598642822"></head><body><header class="topbar no-print"><div class="inner"><a class="brand" href="../index.html"><span class="brand-logo">🌍</span><span>Geography & Environment</span></a><button class="mobile-menu" data-mobile-menu>Menu</button><nav class="navlinks"><a href="../index.html">Home</a><a href="student-registration.html">Registration</a><a href="student-result.html">Result</a><a href="teacher-marks-entry.html">Marks Entry</a><a href="exam-management.html">Exam</a><a class="nav-cta" href="seminar-library-admin.html">Library</a></nav></div></header><section class="page-hero"><div class="container"><h1>Additional Student Information</h1></div></section><main class="page-pad"><div class="container thin"><form id="stepForm" class="panel panel-lg"><div class="panel-title"><div><h2>Personal & Academic Details</h2></div><span class="pill blue">Step Form</span></div><div class="form-grid"><label class="field"><span class="label">Student Name</span><input class="input" name="fullName" required></label><label class="field"><span class="label">Roll/ID</span><input class="input" name="rollId" required></label><label class="field"><span class="label">Academic Level</span><input class="input" name="academicLevel" placeholder="Honours 1st Year" required></label><label class="field"><span class="label">Phone</span><input class="input" name="phone" required></label><label class="field"><span class="label">Session</span><input class="input" name="session" placeholder="2024-25"></label><label class="field"><span class="label">Guardian Phone</span><input class="input" name="guardianPhone" placeholder="01XXXXXXXXX"></label><label class="field full"><span class="label">Address</span><textarea name="address" placeholder="Present address"></textarea></label></div><div id="stepStatus" class="status info hide"></div><div class="right-actions"><a class="btn ghost" href="student-registration.html">← Back</a><button class="btn primary" type="submit">Save Details</button></div></form></div></main>
<script src="../assets/geography-api.js"></script><script>
document.getElementById('stepForm').addEventListener('submit', async (e)=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),st=document.getElementById('stepStatus'),b=f.querySelector('button');b.textContent='Please wait...';b.disabled=true;try{const res=await geoApiPost({action:'registerStudent',fullName:fd.get('fullName'),rollId:fd.get('rollId'),academicLevel:fd.get('academicLevel'),phone:fd.get('phone'),session:fd.get('session'),guardianPhone:fd.get('guardianPhone'),address:fd.get('address')});showStatus(st,res.success?'ok':'err',res.message||'Saved');if(res.success)f.reset()}catch(err){showStatus(st,'err',err.message)}finally{b.textContent='Save Details';b.disabled=false}})
</script>
